[package]
name = "tuiframe-cli"
version = "0.1.0"
edition = "2024"
description = "CLI tool for tuiframe — browse, scaffold, and select components"

[dependencies]
tuiframe-core = { path = "../tuiframe-core" }
tuiframe-viz = { path = "../tuiframe-viz" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
ratatui = "0.30"
crossterm = "0.29"
ctrlc = "3"
portable-pty = "0.9"
serde_json = "1"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
